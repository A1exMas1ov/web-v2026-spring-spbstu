<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Lab_4</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
        <h1>Товары</h1>
    </header>
    <h3>Добавить новый товар</h3>
    <form id="productForm">
        <input type="text" id="prodName" placeholder="Название товара" required>
        <input type="text" id="prodSuppliers" placeholder="Поставщики">
        <button type="submit">Добавить товар</button>
    </form>
    <hr>
    <h3>Утилиты</h3>
    <div>
        <button onclick="showUniqueSuppliers()">Уникальные поставщики</button>
        <button onclick="showMaxSuppliers()">Макс. поставщиков</button>
    </div>
    <div>
        <input type="text" id="filterSupplierInput" placeholder="Имя поставщика">
        <button onclick="showBySupplier()">Найти по поставщику</button>
    </div>
    <div>
        <button onclick="showGroupBySupplier()">Группировать по поставщику</button>
        <button onclick="showGroupByCount()">Группировать по количеству</button>
        <button onclick="resetView()">Сбросить</button>
    </div>
    <hr>
    <div id="productsList"></div>
    <script src="product.js"></script>
    <script src="productUtils.js"></script>
    <script src="ui.js"></script>
  </body>
</html>
